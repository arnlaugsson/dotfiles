# ═══════════════════════════════════════════════════════════════════
#  worksetup — kitty half of the parallel-agent setup
#  Tracked in ~/.dotfiles/kitty/. Pulled in by an `include` line at
#  the end of ~/.config/kitty/kitty.conf (added by kitty/install.sh).
#  Being last means these bindings win over kitty's defaults.
#  Docs: ~/.config/worksetup.md
# ═══════════════════════════════════════════════════════════════════

# Required for the maximize binding: stack shows one window full-size.
enabled_layouts splits,stack
# ── Maximize / restore the focused pane ────────────────────────────
# iTerm2's Cmd+Shift+Enter. Swaps the tab into `stack` layout (only the
# focused pane visible, full size) and restores your splits on the
# second press.
map cmd+shift+enter toggle_layout stack

# ── Splits ─────────────────────────────────────────────────────────
# hsplit = new pane BELOW, vsplit = new pane RIGHT (kitty names the
# split line, not the direction the pane goes).
map f5          launch --location=hsplit --cwd=current
map f6          launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+d       launch --location=vsplit --cwd=current

# ── Pane focus (iTerm2 Cmd+Opt+arrows, Cmd+[ / Cmd+]) ──────────────
map cmd+opt+left  neighboring_window left
map cmd+opt+right neighboring_window right
map cmd+opt+up    neighboring_window up
map cmd+opt+down  neighboring_window down
map cmd+[         previous_window
map cmd+]         next_window

# ── Closing (nothing here can take out more than one pane) ─────────
# kitty ships Cmd+W = close_tab and Cmd+Shift+W = close_os_window. Both
# are tab-wide or wider, and this setup keeps every workstream as a pane
# in ONE tab — so either of them ends every workstream at once, behind a
# prompt ("close this tab?") that badly undersells what it does.
# So: Cmd+W closes the focused pane only, and the tab-wide close is left
# unbound. Tabs still go away on their own when their last pane closes.
# The confirmation is skipped at a bare shell prompt and asked for when
# an agent or command is actually running in the pane.
map cmd+w close_window_with_confirmation ignore-shell
map cmd+shift+w

# ── Move panes around ──────────────────────────────────────────────
map cmd+shift+left  move_window left
map cmd+shift+right move_window right
map cmd+shift+up    move_window up
map cmd+shift+down  move_window down

# ── See which agent has focus at a glance ──────────────────────────
inactive_text_alpha   0.75
window_border_width   2pt
active_border_color   #61afef
inactive_border_color #3b4048
